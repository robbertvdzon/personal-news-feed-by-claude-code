# Container memory includes heap, metaspace, stacks and native buffers.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  template:
    spec:
      containers:
      - name: backend
        resources:
          requests:
            memory: 320Mi
          limits:
            memory: 448Mi
        env:
        - name: JAVA_TOOL_OPTIONS
          value: -Xmx192m -XX:+UseSerialGC
