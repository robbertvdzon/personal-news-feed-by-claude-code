# Preview-overlay: deploy't een feature-branch in een eigen namespace
# `pnf-<id>`. De ArgoCD ApplicationSet (deploy/applicationset.yaml) vult
# de placeholders in (namespace, image-tag) per open PR.
#
# Verschillen met de productie-overlay:
#   * Eén eigen frontend-Route; OpenShift handelt host-based routing af
#   * Geen PVC voor audio (emptyDir; previews zijn throwaway)
#   * Geen cloudflared (shared via main tunnel + wildcard hostname)
#   * Geen SealedSecret (reflector mirror't 'm automatisch vanuit
#     personal-news-feed naar pnf-*)
#   * Geen preview-router
#   * Geen productie-JWT-sleutel: APP_JWT_SECRET wordt leeggezet, waardoor
#     de backend bij het opstarten zelf een ephemeral sleutel per pod
#     genereert (tokens gelden alleen binnen die preview)
#
# De ApplicationSet patcht namespace + image-tag in.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespace wordt door de ApplicationSet via patch op {0} gezet — niet
# hier hardcoden, want elke PR krijgt een eigen namespace.

resources:
  - ../../base

# Resources die niet in een preview thuishoren — gewist via JSON-merge-patch
# met `$patch: delete`. Deze patches verwijderen ze uit de gerenderde
# manifest-set.
patches:
  - target:
      kind: SealedSecret
      name: newsfeed-api-keys
    patch: |-
      $patch: delete
      apiVersion: bitnami.com/v1alpha1
      kind: SealedSecret
      metadata:
        name: newsfeed-api-keys
  - target:
      kind: Route
      name: frontend
    patch: |-
      - op: replace
        path: /spec/host
        value: preview-host-must-be-set.invalid
  - target:
      kind: Route
      name: backend-debug
    patch: |-
      $patch: delete
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: backend-debug
  - target:
      kind: Route
      name: reader
    patch: |-
      $patch: delete
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: reader
  - target:
      kind: PersistentVolumeClaim
      name: backend-data
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: backend-data
  - target:
      kind: Deployment
      name: cloudflared
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: cloudflared
  # Backend: vervang PVC-mount door emptyDir (audio is throwaway in previews)
  - target:
      kind: Deployment
      name: backend
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes/0
        value:
          name: data
          emptyDir: {}
      # Minder strikt rollout-gedrag — preview spawn moet snel zijn
      - op: replace
        path: /spec/strategy
        value:
          type: RollingUpdate

  # Backend: geen productie-JWT-sleutel in previews. De secretKeyRef naar
  # newsfeed-api-keys/JWT_SECRET vervalt (valueFrom: null) en APP_JWT_SECRET
  # blijft zichtbaar leeg achter, zodat de backend bij het opstarten zelf een
  # ephemeral sleutel genereert. Bewust een strategic-merge-patch in een eigen
  # entry: een positionele JSON6902-patch op de env-index zou meeschuiven zodra
  # er een env-var in de base bijkomt, en kustomize mengt beide patch-vormen
  # niet binnen één entry.
  - target:
      kind: Deployment
      name: backend
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: backend
      spec:
        template:
          spec:
            containers:
              - name: backend
                env:
                  - name: APP_JWT_SECRET
                    value: ""
                    valueFrom: null
