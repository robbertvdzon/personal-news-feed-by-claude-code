apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
- sealed-secret-ai-access.yaml
- sealed-preview-runtime.yaml
patches:
- target:
    kind: SealedSecret
    name: newsfeed-api-keys
  patch: "$patch: delete\napiVersion: bitnami.com/v1alpha1\nkind: SealedSecret\nmetadata:\n\
    \  name: newsfeed-api-keys"
- target:
    kind: Route
    name: frontend
  patch: "- op: replace\n  path: /spec/host\n  value: preview-host-must-be-set.invalid"
- target:
    kind: Route
    name: backend-debug
  patch: "$patch: delete\napiVersion: route.openshift.io/v1\nkind: Route\nmetadata:\n\
    \  name: backend-debug"
- target:
    kind: Route
    name: reader
  patch: "$patch: delete\napiVersion: route.openshift.io/v1\nkind: Route\nmetadata:\n\
    \  name: reader"
- target:
    kind: PersistentVolumeClaim
    name: backend-data
  patch: "$patch: delete\napiVersion: v1\nkind: PersistentVolumeClaim\nmetadata:\n\
    \  name: backend-data"
- target:
    kind: Deployment
    name: cloudflared
  patch: "$patch: delete\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name:\
    \ cloudflared"
- target:
    kind: Deployment
    name: backend
  patch: "- op: replace\n  path: /spec/template/spec/volumes/0\n  value:\n    name:\
    \ data\n    emptyDir: {}\n# Minder strikt rollout-gedrag \u2014 preview spawn\
    \ moet snel zijn\n- op: replace\n  path: /spec/strategy\n  value:\n    type: RollingUpdate\n\
    # Tester-agents hebben geen interactief Google-account. Dit staat alleen\n# in\
    \ de preview-overlay; productie blijft fail-closed achter Google-login.\n- op:\
    \ add\n  path: /spec/template/spec/containers/0/env/-\n  value:\n    name: PNF_PREVIEW_SKIP_GOOGLE_AUTH\n\
    \    value: \"true\"\n# PNF-3: previews draaien geen automatische jobs (uurlijkse\
    \ refresh,\n# dagelijkse samenvatting, podcast-recovery/backfill); die zouden\
    \ de\n# gedeelde Agent Runtime-worker belasten. Handmatige triggers werken wel.\n\
    - op: add\n  path: /spec/template/spec/containers/0/env/-\n  value:\n    name:\
    \ PNF_SCHEDULERS_ENABLED\n    value: \"false\"\n# Eigen idempotency-ruimte per\
    \ preview in de Agent Runtime.\n- op: add\n  path: /spec/template/spec/containers/0/env/-\n\
    \  value:\n    name: PNF_AGENT_RUNTIME_ENV\n    valueFrom:\n      fieldRef:\n\
    \        fieldPath: metadata.namespace"
- target:
    kind: Deployment
    name: backend
  patch: "apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: backend\nspec:\n\
    \  template:\n    spec:\n      containers:\n        - name: backend\n        \
    \  env:\n            - name: APP_JWT_SECRET\n              value: \"\"\n     \
    \         valueFrom: null"
- path: agent-access-patch.yaml
- path: backend-memory.yaml
- path: frontend-memory.yaml
- path: reader-memory.yaml
- path: central-postgres-patch.yaml
