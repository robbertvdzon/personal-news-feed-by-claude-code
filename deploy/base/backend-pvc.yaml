# PersistentVolumeClaim voor runtime-state van de backend (o.a. de paden
# die de admin-cleanup opruimt). Alle applicatiedata leeft in Postgres
# (Neon) — ook de podcast-audio, die sinds migratie
# V5__podcast_audio_bytes.sql als BYTEA in de database staat.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-data
  labels:
    app: backend
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  # StorageClass leeg: OpenShift gebruikt de cluster-default (meestal
  # gp3-csi op AWS, ocs-storagecluster-ceph-rbd on-prem, etc.).
  # Zet 'm hier expliciet als je een specifieke klasse wilt.
