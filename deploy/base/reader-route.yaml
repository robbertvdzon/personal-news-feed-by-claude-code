# OpenShift Route voor de read-only reader-app. Cloudflare stuurt de gedeelde
# wildcard naar de OpenShift-ingressrouter; deze declaratieve host kiest de
# reader-service.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: reader
  labels:
    app: reader
spec:
  host: reader.vdzonsoftware.nl
  to:
    kind: Service
    name: reader
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    # De Cloudflare-connector bereikt de router cluster-intern via HTTP.
    insecureEdgeTerminationPolicy: Allow
  wildcardPolicy: None
