# OpenShift Route voor productie. Cloudflare stuurt de gedeelde
# `*.vdzonsoftware.nl`-wildcard naar de OpenShift-ingressrouter; de router
# selecteert deze service aan de hand van de oorspronkelijke Host-header.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  host: news.vdzonsoftware.nl
  to:
    kind: Service
    name: frontend
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    # De Cloudflare-connector bereikt de router cluster-intern via HTTP.
    insecureEdgeTerminationPolicy: Allow
  wildcardPolicy: None
