spring.application.name=newsfeedbackend
server.port=8080
# Bind op alle interfaces (default-gedrag, expliciet voor de duidelijkheid).
# Met deze instelling is de backend bereikbaar via localhost én via de
# LAN-ip / port-forward. Zet op 127.0.0.1 als je hem alleen lokaal
# beschikbaar wilt hebben.
server.address=0.0.0.0

# Data directory voor admin-only user-cleanup paden. Podcast-MP3's
# liggen sinds V5 in Postgres (audio_bytes), niet meer op deze disk.
app.data-dir=./data

# Database (Postgres via Neon of lokaal). URL + creds verwacht in env
# als JDBC-URL met query-params (zie .env).
spring.datasource.url=${PNF_DATABASE_URL:}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000
# SF-1739: de pool moet bij inactiviteit écht helemaal leeglopen, anders
# ziet Neon permanent verbindingen en suspendt de compute nooit
# (suspend_timeout_seconds=300). minimum-idle=0 is daarvoor essentieel:
# zonder die instelling is minimumIdle gelijk aan maximumPoolSize (5) en
# doet HikariCP's idle-timeout helemaal niets. idle-timeout ruim onder de
# suspend-timeout zodat de pool leeg is vóór Neon gaat slapen.
# Bewust GEEN keepalive-time / validatie-timer: die zou de DB wakker houden.
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000

# Flyway: migraties draaien automatisch bij start.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
# Tolereer migraties die WEL in flyway_schema_history staan maar NIET in
# de repo (bv. verlaten/teruggetrokken V4 in een gedeelde preview-DB).
# Checksum-mismatches op aanwezige migraties blokkeren nog steeds de
# start, dus dit verzwakt de validatie niet voor onze eigen versies.
spring.flyway.ignore-migration-patterns=*:missing

# JWT configuration. Geen default-secret hier: zonder APP_JWT_SECRET
# genereert JwtService een random ephemeral secret (met luide warn) —
# veilig voor lokaal/tests, en een prod-misconfiguratie kan nooit meer
# stilletjes op een publiek bekend secret draaien.
app.jwt.secret=${APP_JWT_SECRET:}
# Enige gebruiker, geen refresh-flow: sessie moet praktisch permanent zijn
# tot handmatige uitlog (net als robberts-assistent/software-factory doen
# met hun 30-dagen-token — hier bewust veel langer omdat er geen enkel
# mechanisme is dat de gebruiker aan het verlopen herinnert).
app.jwt.ttl-days=3650

# Google-login. PNF_GOOGLE_USERS is een komma-gescheiden email=username-mapping;
# zo blijft de bestaande interne username (en alle bijbehorende feeddata) behouden.
app.auth.google-client-id=${PNF_GOOGLE_CLIENT_ID:}
app.auth.google-users=${PNF_GOOGLE_USERS:}
# Alleen true in PR-previews; nooit in productie.
app.auth.preview-skip-google=${PNF_PREVIEW_SKIP_GOOGLE_AUTH:false}
# Tijdelijke/test-only compatibiliteit voor de oude login/register-endpoints.
# Productie gebruikt uitsluitend Google-login.
app.auth.password-enabled=${PNF_PASSWORD_AUTH_ENABLED:false}

# PNF-3: al het AI-werk (LLM, transcriptie, TTS, web search) loopt als job via
# de Agent Runtime (v2 API). De backend praat met geen enkele AI-provider zelf.
app.agent-runtime.base-url=${PNF_AGENT_RUNTIME_URL:https://agent-runtime.vdzonsoftware.nl}
app.agent-runtime.token=${PNF_AGENT_RUNTIME_TOKEN:}
# Onderdeel van de idempotency-key; previews zetten hier bv. pr-123.
app.agent-runtime.environment=${PNF_AGENT_RUNTIME_ENV:prod}
app.agent-runtime.poll-interval-ms=${PNF_AGENT_RUNTIME_POLL_MS:2000}
# Hoe lang een aanroeper maximaal op een job wacht (incl. queue-tijd als de
# worker offline is). De job loopt daarna door; een volgende run met dezelfde
# invoer pakt 'm weer op.
app.agent-runtime.max-wait-minutes=${PNF_AGENT_RUNTIME_MAX_WAIT_MINUTES:120}

# Actie -> vendor/model/MODE. Keys = actie-constanten uit ExternalCall.kt.
# Tekstwerk via het abonnement (Claude op de worker), transcriptie lokaal
# (whisper.cpp op de worker), TTS via de API-modus van de runtime.
app.ai.actions.rss_summarize=${PNF_AI_RSS_SUMMARIZE:anthropic/claude-sonnet-5/SUBSCRIPTION}
app.ai.actions.feed_score=${PNF_AI_FEED_SCORE:anthropic/claude-sonnet-5/SUBSCRIPTION}
app.ai.actions.feed_summarize=${PNF_AI_FEED_SUMMARIZE:anthropic/claude-sonnet-5/SUBSCRIPTION}
app.ai.actions.daily_summary=${PNF_AI_DAILY_SUMMARY:anthropic/claude-opus-5/SUBSCRIPTION}
app.ai.actions.adhoc_summarize=${PNF_AI_ADHOC_SUMMARIZE:anthropic/claude-sonnet-5/SUBSCRIPTION}
app.ai.actions.podcast_script=${PNF_AI_PODCAST_SCRIPT:anthropic/claude-opus-5/SUBSCRIPTION}
app.ai.actions.podcast_translate=${PNF_AI_PODCAST_TRANSLATE:anthropic/claude-sonnet-5/SUBSCRIPTION}
app.ai.actions.podcast_episode_summarize=${PNF_AI_PODCAST_EPISODE_SUMMARIZE:anthropic/claude-sonnet-5/SUBSCRIPTION}
app.ai.actions.podcast_transcribe=${PNF_AI_PODCAST_TRANSCRIBE:local/large-v3-turbo/LOCAL}
app.ai.actions.podcast_tts=${PNF_AI_PODCAST_TTS:openai/tts-1/API}
app.ai.actions.podcast_tts_elevenlabs=${PNF_AI_PODCAST_TTS_ELEVENLABS:elevenlabs/eleven_multilingual_v2/API}
app.ai.actions.podcast_translate_tts=${PNF_AI_PODCAST_TRANSLATE_TTS:openai/tts-1/API}
# Harde deadline per runtime-attempt (seconden).
app.ai.timeouts.rss_summarize=1800
app.ai.timeouts.feed_score=1800
app.ai.timeouts.feed_summarize=2400
app.ai.timeouts.daily_summary=1800
app.ai.timeouts.adhoc_summarize=2400
app.ai.timeouts.podcast_script=2400
app.ai.timeouts.podcast_translate=3600
app.ai.timeouts.podcast_episode_summarize=1800
app.ai.timeouts.podcast_transcribe=7200
app.ai.timeouts.podcast_tts=3600
app.ai.timeouts.podcast_tts_elevenlabs=3600
app.ai.timeouts.podcast_translate_tts=3600

# Automatische jobs (uurlijkse refresh, dagelijkse samenvatting, podcast-recovery
# en -backfill). PR-previews zetten dit uit; handmatige triggers blijven werken.
app.schedulers.enabled=${PNF_SCHEDULERS_ENABLED:true}

# ElevenLabs-stemmen voor het interviewformaat (de key staat in de Agent Runtime)
app.elevenlabs.voice-interviewer=Jn7U4vF8ZkmjZIZRn4Uk
app.elevenlabs.voice-guest=h6uBOiAjLKklte8hdYio

# Actuator
management.endpoints.web.exposure.include=health,prometheus,info
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true

# Async
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=16
spring.task.execution.pool.queue-capacity=200
spring.task.scheduling.pool.size=4

# KAN-60/SF-1739: tweefasen podcast-ingest. Fase 2 (transcript) start
# event-driven (PodcastTranscriptRequested), niet meer via een poll.
# recovery.cron = uurlijks vangnet voor gemiste events / verlopen backoff
#   (`-` schakelt de job uit). Hoogstens 1x per uur: vaker zou Neon
#   scale-to-zero blokkeren.
# promotion-timeout-hours = na hoeveel uur op show-notes alsnog promotie
#   naar Feed-tab gebeurt als transcript niet binnenkomt (AC #6).
app.podcast.recovery.cron=0 5 * * * *
app.podcast.transcript-worker.promotion-timeout-hours=24

# Logging
logging.level.root=INFO
logging.level.com.vdzon.newsfeedbackend=DEBUG
